name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated static checkers
        run: python -m pip install -r requirements-quality.txt
      - name: Lint and core types (Python 3.9 target)
        run: |
          pre-commit run ruff-check --all-files
          pre-commit run mypy-core --all-files
  pytest-minimal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.9"
            pins: py39
          - python: "3.12"
            pins: py312
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install base package only
        run: |
          python -m pip install pip==25.3
          python -m pip install -c constraints/ci-${{ matrix.pins }}.txt --build-constraint constraints/build-${{ matrix.pins }}.txt . pytest
          python -m pip check
      - name: Verify base profile
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          python -c "import graph2mat; assert graph2mat.MatrixDataProcessor"
          graph2mat --help
          pytest -q tests/test_minimal_install.py -k base

  pytest-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Quick runs skip the tests above 1 s (src/graph2mat/_slow_tests.py);
          # the pinned 3.12 run keeps the full suite.
          - python: "3.9"
            pins: py39
            profile: pinned
            select: "not slow"
          - python: "3.12"
            pins: py312
            profile: pinned
            select: ""
          - python: "3.12"
            pins: py312
            profile: latest
            select: "not slow"
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU profile
        if: matrix.profile == 'pinned'
        run: |
          python -m pip install pip==25.3
          python -m pip install -c constraints/ci-${{ matrix.pins }}.txt torch --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints/ci-${{ matrix.pins }}.txt --build-constraint constraints/build-${{ matrix.pins }}.txt ".[test,tools,server,extrapolation,docs]" httpx
          python -m pip check
      - name: Install latest compatible CPU profile
        if: matrix.profile == 'latest'
        run: |
          python -m pip install pip==25.3
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test,tools,server,extrapolation,docs]" httpx
          python -m pip check
      - name: Run tests
        run: |
          pytest --pyargs graph2mat -q -p no:cacheprovider -W ignore::DeprecationWarning -m "${{ matrix.select }}"
          pytest -q tests -m "${{ matrix.select }}"
