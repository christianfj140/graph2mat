name: tests

on:
  push:
  pull_request:

jobs:
  pytest-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base package only
        run: python -m pip install . pytest
      - name: Verify base profile
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          python -c "import graph2mat; assert graph2mat.MatrixDataProcessor"
          pytest -q tests/test_minimal_install.py -k base

  pytest-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch, versions of the reference benchmark environment)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[test,server]" httpx "mace-torch==0.3.15" "e3nn==0.4.4" "sisl==0.16.4" "pytorch-lightning==2.6.1"
      - name: Run tests
        run: |
          pytest --pyargs graph2mat -q -p no:cacheprovider -W ignore::DeprecationWarning
          pytest -q tests/test_minimal_install.py
