# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    - id: ruff-check
      files: ^(src/graph2mat|tests)/.*\.py$
- repo: local
  hooks:
    - id: mypy-core
      name: mypy (base core, Python 3.9 target)
      entry: python -m mypy --config-file pyproject.toml
      language: python
      additional_dependencies: [mypy==1.19.1, numpy==1.26.4]
      files: ^src/graph2mat/core/.*\.py$
      pass_filenames: false
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
# isort to automatically sort imports
- repo: https://github.com/pycqa/isort
  rev: 6.0.0
  hooks:
    - id: isort
      name: isort (python)
      additional_dependencies: [toml]
# Using this mirror lets us use mypyc-compiled black, which is about 2x faster
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 23.10.1
  hooks:
    - id: black-jupyter
