[project]
requires-python = ">=3.9"

name = "graph2mat"
version = "0.0.13"
description = "Utility package to work with equivariant matrices and graphs."
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "machine learning",
    "equivariance",
    "e3nn",
    "matrix",
]

authors = [
    {name = "Pol Febrer", email = "pfebrer96@gmail.com"},
    {name = "Peter B. Jørgensen", email = "peterbjorgensen@gmail.com"}
]

dependencies = [
    "numpy>=1.26.4,<3",
    "scipy>=1.13.1,<2",
    "ase>=3.26,<4",
    "sisl[viz]>=0.16.2,<0.17",
    "typer>=0.23.2,<1",
]

classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
graph2mat = "graph2mat.tools.cli.cli:app"

[build-system]
requires = [
    "setuptools_scm[toml]>=6.2",
    "scikit-build-core[pyproject]>=0.8,<1",
    "cython>=3,<4",
    "numpy>=2.0.0,<3"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Consider adding
# minimum-version to choose the fallback mechanism in scikit-build-core
wheel.packages = ["src/graph2mat"]

[project.optional-dependencies]
server = [
    "requests",
    "pyyaml",
    "fastapi>=0.108,<1",
    "uvicorn",
    "python-multipart",
    "jinja2",
    "torch>=2.4.1,<3",
    "torch_geometric>=2.4,<3",
    "e3nn>=0.4.4,<0.6",
    "pytorch-lightning>=2.1.4,<3",
    "mace_torch>=0.3.15,<0.4",
    "jsonargparse[signatures]>=4.48,<5"
]

analysis = [
    "plotly",
    "pandas",
    "jinja2"
]

extrapolation = [
    "dscribe>=2.1.2,<3"
]

lightning = [
    "torch>=2.4.1,<3",
    "pytorch-lightning>=2.1.4,<3",
    "jsonargparse[signatures]>=4.48,<5",
    "tensorboard"
]

siesta = [
    "jinja2",
    "pyyaml"
]

torch = [
    "torch>=2.4.1,<3",
    "torch_geometric>=2.4,<3"
]

e3nn = [
    "torch>=2.4.1,<3",
    "torch_geometric>=2.4,<3",
    "e3nn>=0.4.4,<0.6"
]

mace = [
    "torch>=2.4.1,<3",
    "torch_geometric>=2.4,<3",
    "mace_torch>=0.3.15,<0.4"
]

tools = [
    "requests",
    "pyyaml",
    "fastapi>=0.108,<1",
    "uvicorn",
    "python-multipart",
    "plotly",
    "kaleido",
    "pandas",
    "torch>=2.4.1,<3",
    "pytorch-lightning>=2.1.4,<3",
    "jsonargparse[signatures]>=4.48,<5",
    "jinja2",
    "mace_torch>=0.3.15,<0.4",
    "tensorboard"
]

docs = [
    "pyyaml",
    "fastapi>=0.108,<1",
    "uvicorn",
    "plotly>6",
    "pandas",
    "pytorch-lightning>=2.1.4,<3",
    "jsonargparse[signatures]>=4.48,<5",
    "jinja2",
    "sphinx",
    "sphinx-copybutton",
    "sphinx_autodoc_typehints",
    "sphinx_rtd_theme",
    "nbsphinx",
    "ipykernel",
    "torch>=2.4.1,<3",
    "e3nn>=0.4.4,<0.6",
    "torch_geometric>=2.4,<3"
]

test = [
    "pytest",
    "pyyaml",
    "plotly",
    "pandas",
    "pytorch-lightning>=2.1.4,<3",
    "e3nn>=0.4.4,<0.6",
    "torch>=2.4.1,<3",
    "mace_torch>=0.3.15,<0.4",
    "torch_geometric>=2.4,<3",
    "jsonargparse[signatures]>=4.48,<5",
    "jinja2"
]

#"fastapi", "uvicorn"

[tool.cibuildwheel]
build-verbosity = 3
skip = [
    "pp*",
    "*i686",
    "*musllinux*",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py39"
include = ["src/graph2mat/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Semantic errors first; formatting stays with the existing Black/isort hooks.
select = ["E9", "F63", "F7", "F82", "F811", "B015", "PLR0133"]

[tool.mypy]
python_version = "3.9"
files = ["src/graph2mat/core"]
exclude = ["/tests/"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# Optional scientific/ML libraries are opaque to this base-core gate.
# NumPy is deliberately NOT skipped: use real Python-3.9-compatible stubs.
module = ["torch.*", "torch_geometric.*", "sisl.*", "scipy.*", "ase.*", "e3nn.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
